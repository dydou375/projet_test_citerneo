<div id="order-list" class="card">
    <h3 style="margin-bottom:1rem;">
        Liste des commandes ({{ orders|length }})
    </h3>
    {% if orders %}
    <table>
        <thead>
            <tr>
                <th>Référence</th>
                <th>Client</th>
                <th>Montant</th>
                <th>Date</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
            {% include "commandes/_row.html" %}
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p style="color:#999;">Aucune commande ne correspond aux filtres.</p>
    {% endif %}
</div>
