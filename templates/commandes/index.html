{% extends "base.html" %}
{% block content %}
<h2>Commandes</h2>
<div class="layout">

    <div class="form-card card">
        <h3 style="margin-bottom:1rem;">Nouvelle commande</h3>
        <form hx-post="/commandes/"
              hx-target="#order-list"
              hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful) this.reset()">
            <label>Référence</label>
            <input type="text" name="reference" required placeholder="CMD-005">

            <label>Montant (€)</label>
            <input type="number" name="total_amount" required min="0.01" step="0.01" placeholder="99.90">

            <label>Client</label>
            <select name="client_id" required>
                <option value="">-- Choisir un client --</option>
                {% for client in clients %}
                <option value="{{ client.id }}">{{ client.name }}</option>
                {% endfor %}
            </select>

            <button type="submit">Créer la commande</button>
        </form>
    </div>

    <div class="list-card">
        <!-- Barre de filtres + export : formulaire GET classique (pas HTMX)
             car on veut que l'URL reflète les filtres actifs. -->
        <form method="GET" action="/commandes/" style="display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap;">
            <select name="client_id" style="flex:1; margin:0;">
                <option value="">Tous les clients</option>
                {% for client in clients %}
                <option value="{{ client.id }}" {% if filter_client_id == client.id %}selected{% endif %}>
                    {{ client.name }}
                </option>
                {% endfor %}
            </select>

            <select name="status" style="flex:1; margin:0;">
                <option value="">Tous les statuts</option>
                {% for s in statuses %}
                <option value="{{ s.value }}" {% if filter_status == s.value %}selected{% endif %}>
                    {{ s.value }}
                </option>
                {% endfor %}
            </select>

            <button type="submit" style="width:auto; padding:0.5rem 1rem;">Filtrer</button>

            <!-- formaction redirige ce bouton vers /export.csv avec les mêmes paramètres -->
            <button type="submit" formaction="/commandes/export.csv"
                    style="width:auto; padding:0.5rem 1rem; background:#27ae60;">
                Exporter CSV
            </button>

            {% if filter_client_id or filter_status %}
            <a href="/commandes/" style="align-self:center; font-size:0.85rem; color:#999;">✕ Réinitialiser</a>
            {% endif %}
        </form>

        {% include "commandes/_list.html" %}
    </div>

</div>
{% endblock %}
